name: Mojo compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mojo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Application / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: once-campfire-mojo
          fetch-depth: 0
          persist-credentials: false
      - name: Build pinned toolchain
        working-directory: once-campfire-mojo
        run: docker build -f bench/Dockerfile.tools -t campfire-local-tools:verified .
      - name: Bootstrap pinned independent fixtures
        env:
          CAMPFIRE_WORKSPACE: ${{ github.workspace }}
        run: bash once-campfire-mojo/tools/bootstrap-tests.sh
      - name: Application, byte safety, fault recovery, crypto and native sanitizer tests
        run: |
          set -o pipefail
          mkdir -p once-campfire-mojo/build/ci-logs
          # These two runner-owned checkouts are intentionally mounted into the root container.
          docker run --rm --init -e CAMPFIRE_TEST_NO_AFFINITY=1 \
            -e GIT_CONFIG_COUNT=2 \
            -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/workspace/once-campfire \
            -e GIT_CONFIG_KEY_1=safe.directory -e GIT_CONFIG_VALUE_1=/workspace/once-campfire-mojo \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace/once-campfire-mojo \
            campfire-local-tools:verified bash tools/check.sh 2>&1 | tee once-campfire-mojo/build/ci-logs/application.log
      - name: Build production image
        id: image
        run: bash once-campfire-mojo/tools/build-image.sh campfire-mojo:ci
      - name: Browser and packaged deployment gates
        run: |
          set -o pipefail
          bash once-campfire-mojo/tools/check-package.sh 2>&1 | tee once-campfire-mojo/build/ci-logs/package.log
          bash once-campfire-mojo/tools/check-compose.sh 2>&1 | tee once-campfire-mojo/build/ci-logs/compose.log
          bash once-campfire-mojo/tools/check-migration.sh 2>&1 | tee once-campfire-mojo/build/ci-logs/migration.log
          bash once-campfire-mojo/tools/check-browser.sh 2>&1 | tee once-campfire-mojo/build/ci-logs/browser.log
      - name: Install Node for unchanged upstream browser checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Independent upstream verification with Mojo adapter
        env:
          CAMPFIRE_WORKSPACE: ${{ github.workspace }}
        run: |
          set -o pipefail
          bash once-campfire-mojo/tools/check-upstream.sh 2>&1 | tee once-campfire-mojo/build/ci-logs/upstream.log
      - name: Local secret and dependency scans
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        run: bash once-campfire-mojo/tools/check-security.sh
      - name: Retain check logs and redacted scanner reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ matrix.runner }}
          path: |
            once-campfire-mojo/build/ci-logs
            once-campfire-mojo/build/security
            once-campfire-mojo/build/upstream/**/upstream-integrity-*.json
            once-campfire-mojo/build/upstream/**/*.log
            once-campfire-mojo/build/upstream/**/routes/*.json
            once-campfire-mojo/build/upstream/**/mixed/*.json
          if-no-files-found: warn
          retention-days: 30

  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check workflow syntax
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
