services:
  campfire:
    build: .
    image: campfire-mojo:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8443:8443"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CAMPFIRE_SITE: ${CAMPFIRE_SITE:-http://:8080}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
      MOJO_WORKERS: ${MOJO_WORKERS:-4}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-3}
      CAMPFIRE_RESPONSE_CACHE_MB: ${CAMPFIRE_RESPONSE_CACHE_MB:-64}
      MULTIPART_BYTESIZE_LIMIT: ${MULTIPART_BYTESIZE_LIMIT:-10737418240}
    volumes:
      - campfire:/data
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 4
    pids_limit: 160
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request,urllib.parse; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:3000/up',headers={'Host':urllib.parse.urlsplit(os.environ.get('PUBLIC_ORIGIN','http://localhost:8080')).netloc}))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  campfire:
