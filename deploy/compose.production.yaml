# Standalone configuration; do not merge its public ports with compose.yaml.
services:
  campfire:
    image: ${CAMPFIRE_IMAGE:?Set CAMPFIRE_IMAGE to a tested local image}
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    environment:
      PUBLIC_ORIGIN: https://${CAMPFIRE_DOMAIN:?Set CAMPFIRE_DOMAIN}
      CAMPFIRE_SITE: ${CAMPFIRE_DOMAIN:?Set CAMPFIRE_DOMAIN}
      VAPID_SUBJECT: ${VAPID_SUBJECT:?Set VAPID_SUBJECT to a contact URI}
      MOJO_WORKERS: ${MOJO_WORKERS:-4}
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-3}
      CAMPFIRE_RESPONSE_CACHE_MB: ${CAMPFIRE_RESPONSE_CACHE_MB:-64}
      MULTIPART_BYTESIZE_LIMIT: ${MULTIPART_BYTESIZE_LIMIT:-10737418240}
    volumes:
      - campfire:/data
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 4
    pids_limit: 160
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,urllib.request,urllib.parse; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:3000/up',headers={'Host':urllib.parse.urlsplit(os.environ['PUBLIC_ORIGIN']).netloc}))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  campfire:
