<div class="message__actions" data-controller="soft-keyboard">
  <details class="position-relative" data-controller="popup" data-action="keydown.esc-&gt;popup#close toggle-&gt;popup#toggle click@document-&gt;popup#closeOnClickOutside" data-popup-orientation-top-class="popup-orientation-top">
    <summary class="btn message__action-btn message__options-btn">
      <img class="colorize--black" aria-hidden="true" src="{{ asset:menu-dots-horizontal.svg }}" width="20" height="20" />
      <span class="for-screen-reader">Message options</span>
    </summary>

    <div class="message__actions-menu border shadow" data-popup-target="menu">
      <div class="quick-boosts">
        {{ reactions|safe }}

        <a class="btn message__action-btn message__boost-btn" data-turbo-frame="{{ new_boost_dom }}" data-action="soft-keyboard#open popup#close" href="{{ new_boost_path }}">
          <img class="colorize--black" aria-hidden="true" src="{{ asset:boost.svg }}" width="20" height="20" />
          <span class="for-screen-reader">New boost</span>
</a>      </div>

      <div class="flex flex-wrap border-top margin-block-start-half pad-block-start-half message__actions-grid">
        {%- if has_attachment %}
          <a class="btn message__action-btn center full-width hide-in-ios-pwa" title="Download" aria-label="Download" href="{{ download_path }}">
            <img class="colorize--black" aria-hidden="true" src="{{ asset:download.svg }}" width="20" height="20" />
</a>
          <button class="btn message__action-btn center full-width" data-controller="web-share" data-action="web-share#share" data-web-share-files-value="{{ blob_path }}" data-web-share-title-value="{{ filename }}" title="Share" aria-label="Share">
            <img class="colorize--black" aria-hidden="true" src="{{ asset:share.svg }}" width="20" height="20" />
</button>
        {%- else %}
          <button class="btn message__action-btn center full-width" data-action="reply#reply" title="Reply" aria-label="Reply">
            <img class="colorize--black" aria-hidden="true" src="{{ asset:reply.svg }}" width="20" height="20" />
</button>
        {%- endif %}

        <button class="btn message__action-btn center full-width" title="Copy link" aria-label="Copy link" data-controller="copy-to-clipboard" data-action="copy-to-clipboard#copy" data-copy-to-clipboard-success-class="btn--success" data-copy-to-clipboard-url-value="{{ at_path }}">
          <img class="colorize--black" aria-hidden="true" src="{{ asset:link.svg }}" width="20" height="20" />
</button>
        <a class="btn message__action-btn center full-width message__edit-btn" data-turbo-frame="{{ edit_dom }}" title="Edit" aria-label="Edit" href="{{ edit_path }}">
          <img class="colorize--black" aria-hidden="true" src="{{ asset:pencil.svg }}" width="20" height="20" />
</a>      </div>
    </div>
</details></div>
