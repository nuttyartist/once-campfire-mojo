{%- if has_logo %}
  {{ account_logo|safe }}
  {%- endif %}

  <span class="btn btn--reversed btn--faux room--current">
    <h1 class="room__contents txt-medium overflow-ellipsis">
      {%- if direct %}
        <span class="for-screen-reader">Ping with</span>
      {%- endif %}

      {{ room_name }}
    </h1>
</span>

  <a class="btn" style="view-transition-name: edit-room-{{ room_id }}" data-room-id="{{ room_id }}" href="{{ room_edit_path }}">
    <img aria-hidden="true" src="{{ asset:menu-dots-horizontal.svg }}" width="20" height="20" />
    <span class="for-screen-reader">Settings for this {{ room_noun }}</span>
</a>

  {{ bell|safe }}
