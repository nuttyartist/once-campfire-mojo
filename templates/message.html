<div id="{{ dom_id }}" class="message {% if all_emoji %}message--emoji{% endif %}" data-controller="reply" data-user-id="{{ creator_id }}" data-message-id="{{ id }}" data-message-timestamp="{{ created_epoch }}" data-message-updated-at="{{ updated_epoch }}" data-sort-value="{{ created_epoch }}" data-messages-target="message" data-search-results-target="message" data-refresh-room-target="message" data-reply-composer-outlet="#composer">
    <h2 class="message__day-separator"><time datetime="{{ created_iso }}" data-local-time-target="date"></time></h2>

    <figure class="avatar message__avatar">
      <a title="{{ creator_title }}" class="btn avatar" data-turbo-frame="_top" href="{{ creator_path }}"><img aria-hidden="true" src="{{ creator_avatar }}" width="48" height="48" /></a>
    </figure>

    <turbo-frame id="{{ edit_dom }}">
      <div class="message__body">
        <div class="message__body-content">
          <div class="message__meta">
            <h3 class="message__heading">
              <span class="message__author" title="{{ creator_title }}">
                <strong data-reply-target="author">{{ creator_name }}</strong>
              </span>
              <a target="_top" class="message__permalink" href="{{ at_path }}"><time class="message__timestamp" datetime="{{ created_iso }}" data-local-time-target="time"></time></a>
              <span class="message__room">
                <a target="_top" data-reply-target="link" href="{{ at_path }}">{{ room_name }}</a>
              </span>
            </h3>
            {{ actions|safe }}
          </div>
          
<div id="{{ presentation_dom }}" dir="auto" data-reply-target="body" data-messages-target="body">
  {{ presentation|safe }}
</div>

          {{ boosts|safe }}
        </div>
      </div>
    </turbo-frame>
</div>
